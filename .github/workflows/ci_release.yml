name: Stable Release (multiplatform)

on:
  push:
    tags:
      - '*-stable-release'
  workflow_dispatch:

jobs:

  build_linux64:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        jdk: [21]
        libyara_tag: [ "v4.5.2-subreption" ]
        arch: [linux64]

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up JDK
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: ${{ matrix.jdk }}
          settings-path: ${{ github.workspace }}

      - name: Clone libyara (${{ matrix.libyara_tag }})
        uses: actions/checkout@v4
        with:
          repository: subreption/yara
          path: yara
          ref: ${{ matrix.libyara_tag }}
          token: ${{ secrets.GH_YARA_REPO_PAT }}

      # Step 3: Clone the YARA repository and build it
      - name: Build libyara (${{ matrix.libyara_tag }})
        run: |
          cd yara
          ./bootstrap.sh
          ./configure --without-crypto --enable-area --disable-shared CFLAGS=-fPIC
          make
          echo "YARA_HOME=$PWD" >> $GITHUB_ENV

      # Step 4: Build YARA-Java
      - name: Build YARA-Java
        run: mvn -B package --file pom.xml
        env:
          YARA_HOME: ${{ env.YARA_HOME }}
          YARA_BINARY_PATH: ${{ env.YARA_HOME }}/yara
          YARAC_BINARY_PATH: ${{ env.YARA_HOME }}/yarac

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-artifacts
          path: target/*.jar
          if-no-files-found: error

      - name: Set up Maven settings.xml for GitHub Packages
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>github</id><username>${{ github.actor }}</username><password>${{ secrets.GITHUB_TOKEN }}</password></server></servers></settings>" > ~/.m2/settings.xml

      - name: Deploy Maven artifacts
        run: mvn deploy -s ~/.m2/settings.xml -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }} || echo "Deployment failed but continuing..."

      - name: Cleanup
        run: |
          rm -rf ~/.m2/settings.xml
    outputs:
      linux-artifact: ${{ steps.build.outputs.maven-artifact }}

  build_osx64:
    runs-on: macos-latest

    strategy:
      matrix:
        jdk: [21]
        libyara_tag: [ "v4.5.2-subreption" ]
        arch: [osx64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK on macOS
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: ${{ matrix.jdk }}
          settings-path: ${{ github.workspace }}

      - name: Install dependencies
        run: |
          brew install \
            autoconf \
            automake \
            bison \
            flex \
            libtool \
            pkg-config \
            jansson \
            libmagic \
            openssl@3 \
            protobuf \
            protobuf-c

      - name: Print versions
        run: |
          bison --version
          gcc --version

      - name: Clone libyara (${{ matrix.libyara_tag }})
        uses: actions/checkout@v4
        with:
          repository: subreption/yara
          path: yara
          ref: ${{ matrix.libyara_tag }}
          token: ${{ secrets.GH_YARA_REPO_PAT }}

      - name: List current working directory
        run: ls -lhRt

      # Step 3: Build libyara on macOS
      - name: Build libyara on macOS (${{ matrix.libyara_tag }})
        run: |
          cd yara
          ./bootstrap.sh
          ./configure --without-crypto --enable-area --disable-shared CFLAGS=-fPIC
          make
          echo "YARA_HOME=$PWD" >> $GITHUB_ENV

      - name: List current working directory
        run: ls -lhRt

      # Step 4: Build YARA-Java on macOS
      - name: Build YARA-Java (macOS)
        run: mvn -B package --file pom.xml
        env:
          YARA_HOME: ${{ env.YARA_HOME }}
          YARA_BINARY_PATH: ${{ env.YARA_HOME }}/yara
          YARAC_BINARY_PATH: ${{ env.YARA_HOME }}/yarac

      - name: Set up Maven settings.xml for GitHub Packages
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>github</id><username>${{ github.actor }}</username><password>${{ secrets.GITHUB_TOKEN }}</password></server></servers></settings>" > ~/.m2/settings.xml

      - name: Deploy Maven artifacts
        run: mvn deploy -Pmac -am -s ~/.m2/settings.xml -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }} || echo "Deployment failed but continuing..."
        env:
          YARA_HOME: ${{ env.YARA_HOME }}
          YARA_BINARY_PATH: ${{ env.YARA_HOME }}/yara
          YARAC_BINARY_PATH: ${{ env.YARA_HOME }}/yarac


      - name: List built
        run: |
          bison --version
          gcc --version

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-artifacts
          path: target/*-osx64.jar
          overwrite: true

      - name: Cleanup
        run: |
          rm -rf ~/.m2/settings.xml

    outputs:
      mac-artifact: ${{ steps.build.outputs.maven-artifact }}

  build_windows64:
    runs-on: windows-latest

    strategy:
      matrix:
        jdk: [21]
        libyara_tag: ["v4.5.2-subreption"]
        arch: [windows64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: ${{ matrix.jdk }}
          settings-path: ${{ github.workspace }}

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            autoconf
            automake
            libtool
            make
            bison
            flex
            pkg-config

      - name: Clone libyara (${{ matrix.libyara_tag }})
        uses: actions/checkout@v4
        with:
          repository: subreption/yara
          path: yara
          ref: ${{ matrix.libyara_tag }}
          token: ${{ secrets.GH_YARA_REPO_PAT }}

      # Note: --enable-area is omitted on Windows because the area module uses
      # Windows SEH (__try keyword) which MinGW GCC does not support.
      - name: Build libyara (${{ matrix.libyara_tag }})
        shell: msys2 {0}
        run: |
          cd yara
          ./bootstrap.sh
          ./configure --without-crypto --disable-shared CFLAGS=-fPIC
          make
          echo "YARA_HOME=$PWD" >> $GITHUB_ENV

      # continue-on-error: the base antrun test-native execution may fire
      # despite the profile override and fail copying yara/yarac binaries
      # that don't exist on Windows. The C source is generated before this.
      - name: Maven compile (Java + JNI source generation)
        run: mvn -B compile -Pwindows-amd64 --file pom.xml
        continue-on-error: true

      - name: Verify JNI C source was generated
        shell: msys2 {0}
        run: |
          test -f target/generated-sources/hawtjni/native-package/src/yara-wrapper.c
          echo "JNI C source generation verified"

      # Key flags:
      #   -DJNI64: Required on Windows x64 — HawtJNI's platform detection only
      #            checks _LP64 (Unix) and misses _WIN64, causing 32-bit jintLong.
      #   -no-undefined: Required by MinGW libtool for DLL shared library linking.
      - name: Build yara-wrapper.dll
        shell: msys2 {0}
        run: |
          PROJECT_ROOT=$(pwd)
          NATIVE_SRC="$PROJECT_ROOT/target/generated-sources/hawtjni/native-package"

          cd "$NATIVE_SRC"
          autoreconf -i
          ./configure --with-jni-jdk="$JAVA_HOME" LIBS="-lws2_32" CFLAGS="-DJNI64 -pipe"

          # Add -no-undefined to LDFLAGS (required by MinGW libtool for DLL linking)
          sed -i 's|^LDFLAGS = \(.*\) -release|LDFLAGS = \1 -no-undefined -release|' Makefile

          make

          DLL=$(find . -name "*.dll" -path "*/.libs/*" | head -1)
          if [ -z "$DLL" ]; then
              echo "ERROR: No DLL found after build"
              find . -type f \( -name "*.dll" -o -name "*.so" -o -name "*.dylib" \) 2>/dev/null
              exit 1
          fi
          echo "Built DLL: $DLL"

          LIB_DIR="$PROJECT_ROOT/target/generated-sources/hawtjni/lib/META-INF/native/windows64"
          TEST_DIR="$PROJECT_ROOT/target/test-classes/META-INF/native/windows64"
          mkdir -p "$LIB_DIR" "$TEST_DIR"
          cp "$DLL" "$LIB_DIR/yara-wrapper.dll"
          cp "$DLL" "$TEST_DIR/yara-wrapper.dll"

      # Run embedded tests only (external tests excluded by windows-amd64 profile).
      # Uses surefire:test to bypass the compile phase and its antrun plugin
      # which may fail trying to copy yara/yarac binaries that don't exist.
      - name: Run embedded tests
        run: mvn -B surefire:test -Pwindows-amd64 --file pom.xml

      # Create the platform JAR manually rather than via mvn package, which
      # would re-trigger the compile phase antrun issue.
      - name: Package windows64 JAR
        run: jar cf target/libyara-4.5.2-SNAPSHOT-windows64.jar -C target/generated-sources/hawtjni/lib META-INF

      - name: Upload windows64 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-artifacts
          path: target/*-windows64.jar
          if-no-files-found: error

    outputs:
      windows-artifact: ${{ steps.build.outputs.maven-artifact }}

  bundle:
    needs: [build_linux64, build_osx64, build_windows64]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux64-artifacts
          path: build/linux64

      - name: Download osx64 build artifacts
        uses: actions/download-artifact@v4
        with:
          name: osx64-artifacts
          path: build/osx64

      - name: Download windows64 build artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows64-artifacts
          path: build/windows64

      # Step to bundle Linux, macOS, and Windows JARs
      - name: Bundle multiplatform JARs
        run: |
          mkdir -p bundled-jars
          cp build/linux64/*.jar bundled-jars/
          cp build/osx64/*.jar bundled-jars/
          cp build/windows64/*.jar bundled-jars/

      - name: Upload bundled JARs
        uses: actions/upload-artifact@v4
        with:
          name: bundled-jars
          path: bundled-jars

    outputs:
      maven-artifact: bundled-jars

  release:
    runs-on: ubuntu-latest
    needs: bundle

    strategy:
      matrix:
        jdk: [21]
        libyara_tag: ["v4.5.2-subreption"]

    steps:
      - name: Download build artifacts (jars)
        uses: actions/download-artifact@v4
        with:
          name: bundled-jars

      - name: List current working directory
        run: ls -lhRt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref }} (multiplatform)
          draft: true
          prerelease: false
          generate_release_notes: true
          files: ./*.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
